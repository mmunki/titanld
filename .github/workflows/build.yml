name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Show Android SDK and NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          ls "$ANDROID_HOME/build-tools" | sort -V | tail -3
          ls "$ANDROID_HOME/platforms" | sort -V | tail -3
          ls "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt" 2>/dev/null || true

      - name: Build, test every ABI and verify the APK
        run: bash build.sh

      - name: Prove the custom renderer replaced MobileGlues
        run: |
          test -f build/TitanLD-2.0.1.apk
          listing="$(unzip -l build/TitanLD-2.0.1.apk)"
          if grep -q libmobileglues.so <<<"$listing"; then
            echo "MobileGlues is still in the APK" >&2
            exit 1
          fi
          grep -E 'lib/.+/libtitanld.so' <<<"$listing"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TitanLD-apk
          path: build/TitanLD-*.apk
          if-no-files-found: error
